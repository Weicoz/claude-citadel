static=🚀 Google AI, 🇺🇸 海外出口, 🔀 中转节点, ⚡ 自动择优, 🛟 Fallback, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Google.png
static=📧 邮件收件, direct, 🔀 中转节点, 🌐 海外服务, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Mail.png
