# ==============================================================================
# Quantumult X 基础配置模板 (templates/qx.conf)
# 承袭 21 套核心策略组架构与 17 组上游规则源
# ==============================================================================

[general]
dns_exclusion_list = *.163.com, *.netease.com, *.uuremote.com, *.kuaishou.com
fallback_udp_policy = reject
; 丢弃 STUN，避免 WebRTC 暴露真实公网 IP
udp_drop_list = STUN
excluded_routes = 127.0.0.0/8, 169.254.0.0/16, 224.0.0.0/4, 255.255.255.255/32

[server_local]

[server_remote]

[policy]
static=🔀 中转节点, direct, ⚡ 自动择优, 🛟 Fallback, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Static.png
url-latency-benchmark=⚡ 自动择优, server-tag-regex=.*, check-interval=90, tolerance=100, check-url=http://cp.cloudflare.com/generate_204, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Auto.png
fallback=🛟 Fallback, server-tag-regex=.*, check-interval=90, check-url=http://cp.cloudflare.com/generate_204, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Available.png
static=🌐 海外服务, 🔀 中转节点, ⚡ 自动择优, 🇺🇸 海外出口, direct, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Global.png
