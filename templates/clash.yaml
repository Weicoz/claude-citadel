mixed-port: 7897
allow-lan: false
mode: rule
find-process-mode: strict
log-level: warning
ipv6: false
tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  endpoint-independent-nat: true
  route-exclude-address: []
  dns-hijack:
  - any:53
  disable-icmp-forwarding: true
dns:
  enable: true
  listen: 127.0.0.1:7874
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/15
  fake-ip-filter:
  - +.kuaishou.com
  - +.kuaishou.cn
  - +.gifshow.com
  - +.ksapisrv.com
  - +.kwaicdn.com
  - +.kwimgs.com
  - +.yximgs.com
  respect-rules: true
  default-nameserver:
  - https://223.5.5.5/dns-query
  - https://1.12.12.12/dns-query
  nameserver:
  - https://dns.google/dns-query
  - https://cloudflare-dns.com/dns-query
  direct-nameserver:
  - https://223.5.5.5/dns-query
  - https://1.12.12.12/dns-query
  proxy-server-nameserver:
  - https://223.5.5.5/dns-query
  - https://1.12.12.12/dns-query
  follow-rule: true
  nameserver-policy:
    +.163.com:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
    +.netease.com:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
    +.uuremote.com:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
    +.kuaishou.com:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
proxies: []
proxy-providers: {}
proxy-groups:
- name: 🔀 中转节点
  type: select
  proxies:
  - ⚡ 自动择优
  - 🛟 Fallback
- name: ⚡ 自动择优
  type: url-test
  url: http://cp.cloudflare.com/generate_204
  expected-status: "204"
  interval: 90
  tolerance: 100
  proxies: []
- name: 🛟 Fallback
  type: fallback
  url: http://cp.cloudflare.com/generate_204
  expected-status: "204"
  interval: 90
  proxies: []
- name: 🌐 海外服务
  type: select
  proxies:
  - 🔀 中转节点
  - ⚡ 自动择优
  - 🇺🇸 海外出口
  - DIRECT
- name: 🇺🇸 海外出口
  type: select
  proxies: []
- name: 🤖 OpenAI
  type: select
  proxies:
  - 🇺🇸 海外出口
  - 🇺🇸 美国节点
  - 🇯🇵 日本节点
  - 🇸🇬 新加坡节点
  - 🔀 中转节点
- name: 🚀 Google AI
  type: select
  proxies:
  - 🇺🇸 海外出口
  - 🇺🇸 美国节点
  - 🇯🇵 日本节点
  - 🇸🇬 新加坡节点
  - 🔀 中转节点
- name: 📧 邮件收件
  type: select
  proxies:
  - DIRECT
  - 🔀 中转节点
  - 🌐 海外服务
- name: ✈️ Telegram
  type: select
  proxies:
  - 🔀 中转节点
  - 🇸🇬 新加坡节点
  - 🇭🇰 香港节点
  - 🇯🇵 日本节点
- name: 🍎 Apple
  type: select
  proxies:
  - DIRECT
  - 🔀 中转节点
  - ⚡ 自动择优
  - 🇭🇰 香港节点
  - 🇯🇵 日本节点
  - 🇺🇸 美国节点
  - 🇸🇬 新加坡节点
  - 🇹🇼 台湾节点
- name: 🎮 Steam
  type: select
  proxies:
  - DIRECT
  - 🔀 中转节点
  - ⚡ 自动择优
  - 🇭🇰 香港节点
  - 🇯🇵 日本节点
  - 🇺🇸 美国节点
  - 🇸🇬 新加坡节点
  - 🇹🇼 台湾节点
- name: 🔗 直连改道
  type: select
  proxies:
  - DIRECT
  - 🔀 中转节点
  - 🌐 海外服务
  - 🇺🇸 海外出口
  - ⚡ 自动择优
  - 🛟 Fallback
- name: 🇭🇰 香港节点
  type: select
  filter: (?i)港|hk|hongkong|hong kong
  proxies: []
- name: 🇯🇵 日本节点
  type: select
  filter: (?i)日|jp|japan
  proxies: []
- name: 🇺🇸 美国节点
  type: select
  filter: (?i)美|us|united states
  proxies: []
- name: 🇸🇬 新加坡节点
  type: select
  filter: (?i)新|sg|singapore
  proxies: []
- name: 🇹🇼 台湾节点
  type: select
  filter: (?i)台|tw|taiwan
  proxies: []
rules:
- DOMAIN-SUFFIX,claude.ai,🇺🇸 海外出口
- DOMAIN-SUFFIX,anthropic.com,🇺🇸 海外出口
- DOMAIN-SUFFIX,claude.com,🇺🇸 海外出口
- DOMAIN-SUFFIX,ipify.org,🇺🇸 海外出口
- DOMAIN-SUFFIX,ifconfig.me,🇺🇸 海外出口
- DOMAIN-SUFFIX,ipinfo.io,🇺🇸 海外出口
- DOMAIN-SUFFIX,icanhazip.com,🇺🇸 海外出口
- DOMAIN-SUFFIX,myip.com,🇺🇸 海外出口
- PROCESS-NAME,claude,🇺🇸 海外出口
- PROCESS-NAME,Claude,🇺🇸 海外出口
- PROCESS-NAME,claude.exe,🇺🇸 海外出口
- PROCESS-NAME,Claude.exe,🇺🇸 海外出口
- PROCESS-NAME-REGEX,^claude( .*)?$,🇺🇸 海外出口
- PROCESS-PATH-REGEX,^/Users/[^/]+/\.local/(bin/claude|share/claude/(versions/[^/]+|ClaudeCode\.app/Contents/MacOS/claude))$,🇺🇸
  海外出口
- RULE-SET,claude-citadel-claude,🇺🇸 海外出口
- DOMAIN-SUFFIX,local,DIRECT
- IP-CIDR,0.0.0.0/8,DIRECT,no-resolve
- IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
- IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
- IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
- IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
- IP-CIDR6,::1/128,DIRECT,no-resolve
- IP-CIDR6,fc00::/7,DIRECT,no-resolve
- IP-CIDR6,fe80::/10,DIRECT,no-resolve
- RULE-SET,claude-citadel-direct-supplement,DIRECT
- RULE-SET,claude-citadel-proxy-supplement,🇺🇸 海外出口
- RULE-SET,claude-citadel-openai,🤖 OpenAI
- RULE-SET,claude-citadel-google-ai,🚀 Google AI
- RULE-SET,claude-citadel-telegram,✈️ Telegram,no-resolve
- RULE-SET,claude-citadel-apple,🍎 Apple
- RULE-SET,claude-citadel-steam,🎮 Steam
- RULE-SET,claude-citadel-discord,🌐 海外服务
- RULE-SET,claude-citadel-microsoft,🌐 海外服务
- RULE-SET,claude-citadel-mail,📧 邮件收件
- RULE-SET,claude-citadel-gfw,🌐 海外服务
- RULE-SET,claude-citadel-direct,DIRECT
- RULE-SET,claude-citadel-cn-ip,DIRECT,no-resolve
- GEOIP,CN,DIRECT
- MATCH,🇺🇸 海外出口
rule-providers:
  claude-citadel-claude:
    type: http
    behavior: classical
    format: yaml
    path: ./ruleset/claude-citadel-claude.yaml
