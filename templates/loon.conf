# ==============================================================================
# Loon 基础配置模板 (templates/loon.conf)
# 承袭 21 套核心策略组架构、Proxy Chain 与 17 组上游规则源
# ==============================================================================

[General]
ipv6 = false
# ---- 防泄漏加固：仅旁路回环/链路本地/组播/广播，私网段保留在 TUN 内 ----
bypass-tun = 127.0.0.0/8, 169.254.0.0/16, 224.0.0.0/4, 255.255.255.255/32, fc00::/7, fe80::/10
dns-server = 223.5.5.5,119.29.29.29
doh-server = https://dns.google/dns-query,https://cloudflare-dns.com/dns-query
hijack-dns = *:53
allow-udp-proxy = true
allow-wifi-access = false

[Proxy]

[Remote Proxy]

[Proxy Chain]

[Proxy Group]
🔀 中转节点 = select,⚡ 自动择优,🛟 Fallback
⚡ 自动择优 = url-test,url=http://cp.cloudflare.com/generate_204,interval=90,tolerance=100
🛟 Fallback = fallback,url=http://cp.cloudflare.com/generate_204,interval=90
🌐 海外服务 = select,🔀 中转节点,⚡ 自动择优,🇺🇸 海外出口,DIRECT
🇺🇸 海外出口 = select,DIRECT
🤖 OpenAI = select,🇺🇸 海外出口,🔀 中转节点,⚡ 自动择优,🛟 Fallback
🚀 Google AI = select,🇺🇸 海外出口,🔀 中转节点,⚡ 自动择优,🛟 Fallback
📧 邮件收件 = select,DIRECT,🔀 中转节点,🌐 海外服务
✈️ Telegram = select,🔀 中转节点,⚡ 自动择优,🛟 Fallback
🍎 Apple = select,DIRECT,🔀 中转节点,⚡ 自动择优,🇭🇰 香港节点,🇯🇵 日本节点,🇺🇸 美国节点,🇸🇬 新加坡节点,🇹🇼 台湾节点
🎮 Steam = select,DIRECT,🔀 中转节点,⚡ 自动择优,🇭🇰 香港节点,🇯🇵 日本节点,🇺🇸 美国节点,🇸🇬 新加坡节点,🇹🇼 台湾节点
🔗 直连改道 = select,DIRECT,🔀 中转节点,🌐 海外服务,🇺🇸 海外出口,⚡ 自动择优,🛟 Fallback
🇭🇰 香港节点 = select,🔀 中转节点
🇯🇵 日本节点 = select,🔀 中转节点
🇺🇸 美国节点 = select,🔀 中转节点
🇸🇬 新加坡节点 = select,🔀 中转节点
🇹🇼 台湾节点 = select,🔀 中转节点

[Remote Rule]

[Rule]
DOMAIN-SUFFIX,claude.ai,🇺🇸 海外出口
DOMAIN-SUFFIX,anthropic.com,🇺🇸 海外出口
DOMAIN-SUFFIX,claude.com,🇺🇸 海外出口
DOMAIN-SUFFIX,ipify.org,🇺🇸 海外出口
DOMAIN-SUFFIX,ifconfig.me,🇺🇸 海外出口
DOMAIN-SUFFIX,ipinfo.io,🇺🇸 海外出口
DOMAIN-SUFFIX,icanhazip.com,🇺🇸 海外出口
DOMAIN-SUFFIX,myip.com,🇺🇸 海外出口
IP-CIDR,192.168.10.0/24,DIRECT,no-resolve
IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
DOMAIN-SUFFIX,cn,DIRECT
GEOIP,CN,DIRECT
FINAL,🇺🇸 海外出口
