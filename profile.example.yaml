# ==============================================================================
# Claude Citadel - 统一配置文件 (profile.yaml)
# 在你的 GitHub Secret Gist 中维护此文件，Action 将自动编译为全平台 6 大客户端配置
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Claude 专用出口 (独立出口，专供 Claude / Anthropic 分流，日常流量不走这里)
# ------------------------------------------------------------------------------
claude_exits:
  # 是否强制经由「🔀 中转节点」代理链拨号：
  # - true: 自动为 Claude 节点追加 dialer-proxy / underlying-proxy / chain（适合国内直连不通的住宅 IP / VPS）
  # - false: 直接直连拨号（适合原生可直连的住宅 IP 或专线）
  use_relay_chain: true

  # 形态 A：手动配置节点 (如自建 VPS / 独立住宅 IP / 特殊代理出口，地区可自定义)
  # 支持 socks5, http, ss, trojan, vmess 等所有主流协议
  custom_proxies:
    - name: "🇺🇸 专属出口 (自建VPS/住宅IP)"
      type: socks5
      server: 198.51.100.1
      port: 1080
      # username: "user"
      # password: "password"
      # 单节点覆盖开关：指定 dialer-proxy 或留空
      # dialer-proxy: "🔀 中转节点"

  # 形态 B：专用订阅 (如果有专门解锁 Claude 的独享专线机场/订阅)
  subscriptions: []
    # - name: "Claude专线"
    #   emoji: "🛡️"
    #   url: "https://sub.special-claude.com/api/v1/client/subscribe?token=xxx"

# ------------------------------------------------------------------------------
# 2. 通用中转 / 常规业务节点 (用于日常上网、OpenAI、Google AI、Steam、Telegram 等)
# ------------------------------------------------------------------------------
relays:
  # 形态 A：机场订阅列表 (支持 1 到 4 家或更多，按行添加即可)
  subscriptions:
    - name: "猫咪云"
      emoji: "🐱"
      url: "https://sub.miaona.com/api/v1/client/subscribe?token=example_token_1"
      user_agent: "clash.meta"

    - name: "良心专线"
      emoji: "❤️"
      url: "https://sub.liangxin.com/api/v1/client/subscribe?token=example_token_2"
      user_agent: "ClashMeta"

  # 形态 B：通用手动节点 (非订阅的独立自建 VPS，如自建香港/日本直连节点)
  custom_proxies:
    - name: "🇯🇵 自建日本直连"
      type: ss
      server: 198.51.100.2
      port: 8388
      cipher: aes-256-gcm
      password: "my-ss-password"
      udp: true

# ------------------------------------------------------------------------------
# 3. DIY 自定义策略组与专属节点 (可选高级配置，绝大多数用户无需填写，保持空列表即可)
# 适用于公司专网、私有组网 (EasyTier/Tailscale/ZeroTier)、自建加速专线等任何自定义场景。
# 每个 DIY 分组可挂载专属独立节点（不混入机场测速池）并直接绑定置顶分流规则。
# 不配置时客户端配置完全干净，不产生任何多余分组。
# ------------------------------------------------------------------------------
diy_groups: []
  # - name: "🏢 公司专网" # 自定义策略组名称 (任意命名)
  #   type: select # 策略组类型: select / url-test / fallback
  #   proxies: # 专属独立节点 (仅挂载于此分组，不参与常规中转测速)
  #     - name: "公司内网SOCKS5"
  #       type: socks5
  #       server: 192.168.10.1
  #       port: 1080
  #   rules: # 专属置顶分流规则 (本地行规则)
  #     - "IP-CIDR,192.168.10.0/24,no-resolve"
  #     - "DOMAIN-SUFFIX,company.internal"
  #   remote_rulesets: # 专属远端规则集（支持第三方规则库或个人 Gist 地址）
  #     # - "https://raw.githubusercontent.com/username/repo/main/company_rules.yaml"
  #     # - "https://gist.githubusercontent.com/username/gist_id/raw/my_work_rule.yml"
  #
  # - name: "🕸️ 私有组网" # 第二个 DIY 分组示例 (如 EasyTier 组网)
  #   type: select
  #   proxies:
  #     - name: "EasyTier SOCKS5"
  #       type: socks5
  #       server: 127.0.0.1
  #       port: 15555
  #   rules:
  #     - "IP-CIDR,10.155.155.0/24,no-resolve"
  #     - "IP-CIDR,10.200.0.0/16,no-resolve"
  #     - "PROCESS-NAME,easytier-core"
  #   remote_rulesets:
  #     # - "https://gist.githubusercontent.com/username/gist_id/raw/my_easytier_rule.yml"

# ------------------------------------------------------------------------------
# 4. 自定义分流规则扩展 (可选)
# 默认使用上游全套成熟规则 (OpenAI, Claude, Apple, Telegram, Steam, 国内直连等)。
# 若需添加自定义规则或引用第三方/个人远端规则，按类别填入，自定义规则拥有最高优先级（插入最前端）。
# ------------------------------------------------------------------------------
custom_rules:
  # 直连规则扩展 (Direct)
  direct:
    remote_rulesets:
      # 支持引用公开的第三方规则集或你自己的私有 Gist（支持 .txt / .yaml / .list 自动识别）：
      # 例如：Loyalsoldier 直连补充规则
      # - "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/direct.txt"
      # 例如：个人 Gist 自定义直连规则
      # - "https://gist.githubusercontent.com/username/gist_id/raw/my_direct_rule.yml"
    rules:
      # 本地行规则支持 DOMAIN-SUFFIX, IP-CIDR, PROCESS-NAME 等
      - "DOMAIN-SUFFIX,company.internal"
      - "IP-CIDR,192.168.1.0/24,no-resolve"

  # 中转代理规则扩展 (Relay / 海外服务)
  relay:
    remote_rulesets:
      # 例如：blackmatrix7 规则库的 Proxy 补充规则
      # - "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Proxy/Proxy.yaml"
      # 例如：个人 Gist 自定义海外代理规则
      # - "https://gist.githubusercontent.com/username/gist_id/raw/my_proxy_rule.yml"
    rules:
      - "DOMAIN-SUFFIX,custom-blocked-site.com"

  # Claude / 独立海外出口规则扩展 (Claude Exit)
  claude_exit:
    remote_rulesets:
      # 例如：独立出口的 Claude 专用域名列表（支持第三方或个人 Gist 地址）
      # - "https://gist.githubusercontent.com/username/gist_id/raw/my_claude_rule.yml"
    rules:
      - "DOMAIN-SUFFIX,my-anthropic-mirror.com"
